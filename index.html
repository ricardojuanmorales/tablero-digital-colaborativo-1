<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero — MVP v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ─── Reset & Variables ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #F7F5F0;
  --surface:  #FFFFFF;
  --accent:   #4440B8;
  --accent2:  #6C68D4;
  --text:     #1C1B1A;
  --muted:    #7A7875;
  --border:   #E4E1D9;
  --radius:   10px;
  --radius-lg:16px;
  --ff-disp:  'Fraunces', Georgia, serif;
  --ff-body:  'DM Sans', system-ui, sans-serif;
  --shadow:   0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
}
html { font-family: var(--ff-body); font-size: 15px; color: var(--text); background: var(--bg); }
button { font-family: var(--ff-body); cursor: pointer; }
input, textarea, select { font-family: var(--ff-body); }
a { color: inherit; text-decoration: none; }

/* ─── Utilities ─── */
.hidden { display: none !important; }
.flex { display: flex; }
.col  { flex-direction: column; }
.gap4 { gap: 4px; }
.gap8 { gap: 8px; }
.gap12 { gap: 12px; }
.gap16 { gap: 16px; }
.ai-center { align-items: center; }
.jc-between { justify-content: space-between; }
.flex1 { flex: 1; }

/* ─── Inputs ─── */
input[type=text], input[type=email], textarea, select {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--surface); color: var(--text);
  font-size: 14px; outline: none; transition: border-color .15s;
}
input[type=text]:focus, input[type=email]:focus, textarea:focus, select:focus {
  border-color: var(--accent2);
}
textarea { resize: vertical; min-height: 72px; }

/* ─── Buttons ─── */
.btn {
  padding: 8px 18px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 500;
  transition: all .15s;
}
.btn:hover { background: var(--bg); color: var(--text); }
.btn-primary {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.btn-primary:hover { background: #3735a0; }
.btn-ghost { border: none; background: transparent; color: var(--muted); padding: 6px 10px; font-size: 13px; }
.btn-ghost:hover { color: var(--text); background: var(--bg); border-radius: var(--radius); }
.btn-icon { width: 32px; height: 32px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 15px; transition: all .15s; }
.btn-icon:hover { background: var(--bg); }
.btn-danger { color: #c0392b; border-color: #f5c6c6; background: #fff5f5; }
.btn-danger:hover { background: #fee2e2; }

/* ─── Tag / Badge ─── */
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }

/* ─── Layout: App shell ─── */
#app { min-height: 100vh; display: flex; flex-direction: column; }

/* ─── Topbar ─── */
#topbar {
  height: 52px; display: flex; align-items: center; gap: 12px;
  padding: 0 20px; border-bottom: 1px solid var(--border);
  background: var(--surface); position: sticky; top: 0; z-index: 100;
}
.logo { font-family: var(--ff-disp); font-size: 20px; font-weight: 600; color: var(--accent); letter-spacing: -.5px; }
.logo span { font-style: italic; }
.topbar-spacer { flex: 1; }
.avatar-chip { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: #fff; flex-shrink: 0; }

/* ─── Home screen ─── */
#screen-home { flex: 1; padding: 32px 24px; max-width: 960px; margin: 0 auto; width: 100%; }
.home-heading { font-family: var(--ff-disp); font-size: 28px; font-weight: 400; color: var(--text); margin-bottom: 6px; }
.home-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
.boards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.board-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  overflow: hidden; cursor: pointer; transition: box-shadow .15s, transform .12s;
}
.board-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.board-cover { height: 72px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
.board-body { padding: 11px 14px 13px; }
.board-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.privacy-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.board-card-new {
  border: 1.5px dashed var(--border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; min-height: 130px; cursor: pointer; color: var(--muted);
  font-size: 13px; transition: all .15s;
}
.board-card-new:hover { border-color: var(--accent2); color: var(--accent); background: #f5f4ff; }
.plus-ring { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; }

/* ─── Board screen ─── */
#screen-board { flex: 1; display: flex; overflow: hidden; }
#sidebar {
  width: 200px; flex-shrink: 0; border-right: 1px solid var(--border);
  background: var(--surface); display: flex; flex-direction: column; overflow-y: auto;
  padding: 12px 0;
}
.sb-section-label { font-size: 10px; font-weight: 500; color: var(--muted); padding: 8px 16px 4px; letter-spacing: .05em; text-transform: uppercase; }
.sb-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 16px;
  font-size: 13px; color: var(--muted); cursor: pointer; transition: all .1s;
}
.sb-item:hover, .sb-item.active { color: var(--text); background: var(--bg); }
.sb-item.active { font-weight: 500; }
.sb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sb-icon { font-size: 14px; }
#board-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#board-head {
  display: flex; align-items: center; gap: 10px; padding: 12px 20px;
  border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
}
.board-head-title { font-size: 15px; font-weight: 500; color: var(--text); }
.privacy-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
.layout-btns { display: flex; gap: 3px; margin-left: auto; }
.layout-btn {
  width: 30px; height: 30px; border-radius: var(--radius); border: 1px solid var(--border);
  background: transparent; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--muted); transition: all .12s;
}
.layout-btn.active { background: #EEEDFB; border-color: var(--accent2); color: var(--accent); }
#board-area { flex: 1; overflow: auto; padding: 20px; }

/* ─── Wall layout ─── */
.wall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.post-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  overflow: hidden; cursor: pointer; transition: box-shadow .15s;
  position: relative;
}
.post-card:hover { box-shadow: var(--shadow); }
.post-accent { height: 4px; }
.post-body { padding: 12px; }
.post-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
.post-content { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
.post-footer { display: flex; align-items: center; justify-content: space-between; }
.post-img-wrap { overflow: hidden; border-radius: var(--radius-lg) var(--radius-lg) 0 0; cursor: pointer; }
.post-img { width: 100%; height: 120px; object-fit: cover; display: block; transition: transform .2s; }
.post-card:hover .post-img { transform: scale(1.03); }
.post-source-btn {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500;
  padding: 3px 8px; border-radius: 20px; border: 1px solid var(--border);
  color: var(--muted); background: var(--bg); text-decoration: none; transition: all .12s; white-space: nowrap;
}
.post-source-btn:hover { border-color: var(--accent2); color: var(--accent); background: #f5f4ff; }
.post-tag { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; }

/* ─── Kanban layout ─── */
.kanban-wrap { display: flex; gap: 12px; align-items: flex-start; min-height: 300px; }
.k-col { flex: 1; min-width: 150px; background: var(--bg); border-radius: var(--radius-lg); padding: 10px; }
.k-col-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 0 2px; }
.k-col-title { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.k-count { font-size: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1px 7px; color: var(--muted); }
.k-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px; margin-bottom: 6px; cursor: pointer; transition: box-shadow .12s;
}
.k-card:hover { box-shadow: var(--shadow); }
.k-card-accent { width: 100%; height: 3px; border-radius: 2px; margin-bottom: 8px; }
.k-card-title { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
.k-card-tag { font-size: 10px; padding: 2px 7px; border-radius: 20px; display: inline-block; margin-top: 4px; }

/* ─── Timeline layout ─── */
.timeline-wrap { display: flex; flex-direction: column; min-width: 600px; }
.tl-months { display: flex; margin-left: 130px; margin-bottom: 6px; }
.tl-month { flex: 1; font-size: 10px; color: var(--muted); text-align: center; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
.tl-row { display: flex; align-items: center; min-height: 40px; border-bottom: 1px solid var(--border); }
.tl-label { width: 130px; flex-shrink: 0; font-size: 12px; color: var(--muted); padding-right: 12px; text-align: right; }
.tl-bar-area { flex: 1; position: relative; height: 24px; }
.tl-bar {
  height: 100%; border-radius: 6px; position: absolute;
  display: flex; align-items: center; padding: 0 10px;
  font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden;
}

/* ─── AI Panel ─── */
#ai-panel {
  border-top: 1px solid var(--border); padding: 10px 20px;
  display: flex; align-items: center; gap: 12px; background: var(--surface); flex-shrink: 0;
}
.ai-label { font-size: 11px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.ai-gem { width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; }
.ai-chip {
  font-size: 11px; padding: 4px 10px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--muted); cursor: pointer; white-space: nowrap; transition: all .12s;
}
.ai-chip:hover { border-color: var(--accent2); color: var(--accent); background: #f5f4ff; }
.ai-chips { display: flex; gap: 6px; overflow-x: auto; flex: 1; }
.ai-chips::-webkit-scrollbar { display: none; }

/* ─── Modal ─── */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.25);
  display: flex; align-items: center; justify-content: center; z-index: 200;
  animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity: 0; } }
.modal {
  background: var(--surface); border-radius: var(--radius-lg); padding: 24px;
  width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.15);
  animation: slideUp .18s ease;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } }
.modal-title { font-family: var(--ff-disp); font-size: 18px; font-weight: 400; color: var(--text); margin-bottom: 18px; }
.form-field { margin-bottom: 14px; }
.form-label { font-size: 12px; color: var(--muted); margin-bottom: 5px; display: block; font-weight: 500; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
.color-picker { display: flex; gap: 8px; }
.color-swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all .12s; }
.color-swatch.sel { border-color: var(--text); transform: scale(1.15); }
.privacy-select { display: flex; gap: 6px; }
.privacy-opt {
  flex: 1; border: 1px solid var(--border); border-radius: var(--radius); padding: 7px;
  cursor: pointer; text-align: center; transition: all .12s; font-size: 11px; color: var(--muted);
}
.privacy-opt.sel { border-color: var(--accent2); background: #f5f4ff; color: var(--accent); font-weight: 500; }
.icon-picker { display: flex; gap: 6px; flex-wrap: wrap; }
.icon-opt { width: 34px; height: 34px; border-radius: var(--radius); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: all .12s; }
.icon-opt.sel { border-color: var(--accent2); background: #f5f4ff; }
.kanban-col-select { display: flex; gap: 5px; flex-wrap: wrap; }
.kcol-opt { flex: 1; min-width: 80px; border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 8px; text-align: center; font-size: 11px; color: var(--muted); cursor: pointer; transition: all .12s; }
.kcol-opt.sel { border-color: var(--accent2); background: #f5f4ff; color: var(--accent); font-weight: 500; }

/* ─── Onboarding ─── */
#screen-onboarding {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: var(--bg); padding: 24px;
}
.ob-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  width: 100%; max-width: 420px; overflow: hidden;
}
.ob-progress { height: 3px; background: var(--bg); }
.ob-fill { height: 3px; background: var(--accent); transition: width .3s ease; }
.ob-body { padding: 32px 28px 24px; }
.ob-step-label { font-size: 11px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 8px; }
.ob-title { font-family: var(--ff-disp); font-size: 22px; font-weight: 400; color: var(--text); margin-bottom: 6px; line-height: 1.3; }
.ob-sub { font-size: 13px; color: var(--muted); margin-bottom: 22px; line-height: 1.6; }
.ob-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; }
.ob-role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ob-role {
  border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 10px;
  cursor: pointer; text-align: center; transition: all .12s;
}
.ob-role:hover { border-color: var(--accent2); background: #f5f4ff; }
.ob-role.sel { border-color: var(--accent); background: #EEEDFB; }
.ob-role-icon { font-size: 22px; margin-bottom: 5px; }
.ob-role-name { font-size: 12px; font-weight: 500; color: var(--text); }
.ob-role-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.ob-tmpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ob-tmpl { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: all .12s; }
.ob-tmpl:hover { border-color: var(--accent2); }
.ob-tmpl.sel { border-color: var(--accent); }
.ob-tmpl-cover { height: 44px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.ob-tmpl-body { padding: 7px 10px; }
.ob-tmpl-title { font-size: 12px; font-weight: 500; color: var(--text); }
.ob-tmpl-sub { font-size: 11px; color: var(--muted); }
.ob-priv-list { display: flex; flex-direction: column; gap: 8px; }
.ob-priv {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all .12s;
}
.ob-priv:hover { border-color: var(--accent2); }
.ob-priv.sel { border-color: var(--accent); background: #f5f4ff; }
.ob-radio { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.ob-radio.on { border-color: var(--accent); background: var(--accent); }
.ob-radio.on::after { content:''; width:5px; height:5px; border-radius:50%; background:#fff; }
.ob-success { text-align: center; padding: 16px 0; }
.ob-success-icon { font-size: 44px; margin-bottom: 14px; }
</style>
</head>
<body>
<div id="app">
  <!-- Topbar -->
  <div id="topbar">
    <div class="logo">ta<span>bl</span>ero</div>
    <div class="topbar-spacer"></div>
    <div id="topbar-actions"></div>
  </div>

  <!-- Screens -->
  <div id="screen-onboarding" class="hidden"></div>
  <div id="screen-home"       class="hidden"></div>
  <div id="screen-board" class="hidden">
    <div id="sidebar"></div>
    <div id="board-content" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div id="board-head" style="display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0"></div>
      <div id="board-area" style="flex:1;overflow:auto;padding:20px"></div>
      <div id="ai-panel" style="border-top:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;background:var(--surface);flex-shrink:0"></div>
    </div>
  </div>
</div>

<!-- Modal container -->
<div id="modal-root"></div>

<script>
/* ══════════════════════════════════════════════
   ESTADO GLOBAL
══════════════════════════════════════════════ */
const COLORS = {
  purple: { accent: '#7C3AED', bg: '#EDE9FE', text: '#5B21B6', tag_bg: '#EDE9FE', tag_text: '#6D28D9' },
  teal:   { accent: '#0D9488', bg: '#CCFBF1', text: '#0F766E', tag_bg: '#CCFBF1', tag_text: '#0F766E' },
  amber:  { accent: '#D97706', bg: '#FEF3C7', text: '#92400E', tag_bg: '#FEF3C7', tag_text: '#92400E' },
  coral:  { accent: '#DC2626', bg: '#FEE2E2', text: '#991B1B', tag_bg: '#FFE4E6', tag_text: '#BE123C' },
  pink:   { accent: '#DB2777', bg: '#FCE7F3', text: '#9D174D', tag_bg: '#FCE7F3', tag_text: '#9D174D' },
  gray:   { accent: '#6B7280', bg: '#F3F4F6', text: '#374151', tag_bg: '#F3F4F6', tag_text: '#374151' },
};
const BOARD_COLORS = ['#EDE9FE','#D1FAE5','#FEF3C7','#FFE4E6','#DBEAFE','#F3F4F6'];
const ICONS = ['💡','📣','🔍','🗺','📋','🎯','🚀','📊','✏️','🌟','📝','🎨'];
const KANBAN_COLS = [
  { id:'todo',        label:'Por hacer' },
  { id:'in-progress', label:'En progreso' },
  { id:'review',      label:'Revisión' },
  { id:'done',        label:'Listo' },
];
const TL_PHASES = [
  { label:'Investigación', left:0,   width:30, colorKey:'purple' },
  { label:'Diseño UI',     left:20,  width:35, colorKey:'teal'   },
  { label:'Desarrollo',    left:35,  width:45, colorKey:'amber'  },
  { label:'Beta',          left:65,  width:20, colorKey:'coral'  },
  { label:'Lanzamiento',   left:80,  width:18, colorKey:'pink'   },
];
const TL_MONTHS = ['Ene','Feb','Mar','Abr','May','Jun'];
const AI_CHIPS = [
  'Agrupa ideas similares',
  'Sugiere etiquetas',
  'Genera resumen del board',
  'Detecta temas repetidos',
  'Propón siguiente acción',
];

let state = {
  screen: 'loading',
  user: { name: 'Usuario', avatarColor: '#4440B8', role: 'personal' },
  boards: [],
  posts: {},
  currentBoardId: null,
  currentLayout: 'wall',
};

/* ══════════════════════════════════════════════
   PERSISTENCIA
══════════════════════════════════════════════ */
function guardar() {
  localStorage.setItem('tablero_boards', JSON.stringify(state.boards));
  localStorage.setItem('tablero_posts',  JSON.stringify(state.posts));
  localStorage.setItem('tablero_user',   JSON.stringify(state.user));
}
function cargar() {
  const boards = localStorage.getItem('tablero_boards');
  const posts  = localStorage.getItem('tablero_posts');
  const user   = localStorage.getItem('tablero_user');
  if (boards) state.boards = JSON.parse(boards);
  if (posts)  state.posts  = JSON.parse(posts);
  if (user)   state.user   = JSON.parse(user);
}
function sembrarDatos() {
  state.boards = [
    { id:'board-001', title:'Campaña Q2',      icon:'📣', color:'#EDE9FE', privacy:'team',    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
    { id:'board-002', title:'Investigación UX', icon:'🔍', color:'#D1FAE5', privacy:'private', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
    { id:'board-003', title:'Roadmap 2026',     icon:'🗺', color:'#FEF3C7', privacy:'team',    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
    { id:'board-004', title:'Brainstorm app',   icon:'💡', color:'#FFE4E6', privacy:'public',  createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
  ];
  state.posts = {
    'board-001': [

/* ══════════════════════════════════════════════
   ROUTER
══════════════════════════════════════════════ */
function mostrar(screen) {
  ['onboarding','home','board'].forEach(s =>
    document.getElementById('screen-' + s).classList.add('hidden')
  );
  document.getElementById('screen-' + screen).classList.remove('hidden');
  state.screen = screen;
  renderTopbar();
}

/* ══════════════════════════════════════════════
   TOPBAR
══════════════════════════════════════════════ */
function renderTopbar() {
  const el = document.getElementById('topbar-actions');
  const initials = state.user.name.trim().split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase() || '?';
  if (state.screen === 'board') {
    el.innerHTML = `
      <button class="btn-ghost" onclick="irHome()">← Mis tableros</button>
      <button class="btn btn-primary" onclick="abrirModalNuevoPost()" style="padding:7px 14px;font-size:13px">+ Post</button>
      <div class="avatar-chip" style="background:${state.user.avatarColor}">${initials}</div>
    `;
  } else if (state.screen === 'home') {
    el.innerHTML = `
      <button class="btn btn-primary" onclick="abrirModalNuevoBoard()" style="padding:7px 14px;font-size:13px">+ Nuevo tablero</button>
      <div class="avatar-chip" style="background:${state.user.avatarColor}">${initials}</div>
    `;
  } else {
    el.innerHTML = '';
  }
}

/* ══════════════════════════════════════════════
   BOARD
══════════════════════════════════════════════ */
function irBoard(id) {
  state.currentBoardId = id;
  state.currentLayout = 'wall';
  mostrar('board');
  renderBoard();
}

function renderBoard() {
  const board = state.boards.find(b => b.id === state.currentBoardId);
  if (!board) return irHome();
  const privLabel = { public:'Público', team:'Equipo', private:'Privado' };
  const privColor = { public:'#DCFCE7', team:'#DBEAFE', private:'#F3F4F6' };
  const privTextColor = { public:'#166534', team:'#1e40af', private:'#374151' };

  // Sidebar
  const sb = document.getElementById('sidebar');
  sb.innerHTML = `
    <div class="sb-section-label">Mis tableros</div>
    ${state.boards.map(b => `
      <div class="sb-item${b.id === state.currentBoardId ? ' active':''}" onclick="irBoard('${b.id}')">
        <span class="sb-icon">${b.icon}</span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.title)}</span>
      </div>
    `).join('')}
    <div style="border-top:1px solid var(--border);margin:8px 0"></div>
    <div class="sb-item" onclick="abrirModalNuevoBoard()">
      <span class="sb-icon" style="font-size:16px;color:var(--muted)">+</span>
      <span>Nuevo tablero</span>
    </div>
  `;

  // Board head
  const head = document.getElementById('board-head');
  head.innerHTML = `
    <span style="font-size:18px">${board.icon}</span>
    <span class="board-head-title">${esc(board.title)}</span>
    <span class="privacy-badge" style="background:${privColor[board.privacy]};color:${privTextColor[board.privacy]}">${privLabel[board.privacy]}</span>
    <button class="btn-ghost" style="font-size:12px;margin-left:4px" onclick="abrirModalEditarBoard('${board.id}')">Editar</button>
    <div class="layout-btns">
      ${[['wall','Muro',svgMuro()],['kanban','Kanban',svgKanban()],['timeline','Línea de tiempo',svgTimeline()]].map(([id,label,icon]) => `
        <button class="layout-btn${state.currentLayout===id?' active':''}" title="${label}" onclick="cambiarLayout('${id}')">${icon}</button>
      `).join('')}
    </div>
  `;

  // Board area
  renderLayout();

  // AI panel
  const ai = document.getElementById('ai-panel');
  ai.innerHTML = `
    <div class="ai-label">
      <div class="ai-gem">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 0L6.5 3.5L10 5L6.5 6.5L5 10L3.5 6.5L0 5L3.5 3.5Z" fill="white"/></svg>
      </div>
      IA
    </div>
    <div class="ai-chips">
      ${AI_CHIPS.map(c => `<button class="ai-chip" onclick="sugerenciaIA('${c}')">${c}</button>`).join('')}
    </div>
  `;
}

function cambiarLayout(layout) {
  state.currentLayout = layout;
  // Update layout buttons
  document.querySelectorAll('.layout-btn').forEach((btn, i) => {
    const layouts = ['wall','kanban','timeline'];
    btn.classList.toggle('active', layouts[i] === layout);
  });
  renderLayout();
}

function renderLayout() {
  const area = document.getElementById('board-area');
  const posts = state.posts[state.currentBoardId] || [];
  if (state.currentLayout === 'wall')     area.innerHTML = renderWall(posts);
  else if (state.currentLayout === 'kanban') area.innerHTML = renderKanban(posts);
  else area.innerHTML = renderTimeline();
}

function renderWall(posts) {
  if (!posts.length) return emptyState('Aún no hay posts', 'Haz clic en "+ Post" para agregar el primero.');
  return `<div class="wall-grid">${posts.map(p => wallCard(p)).join('')}</div>`;
}

function wallCard(p) {
  const c = COLORS[p.color] || COLORS.gray;
  const hasImage = p.image && p.image.trim();
  const hasSource = p.sourceUrl && p.sourceUrl.trim();
  return `
    <div class="post-card">
      ${hasImage ? `
        <div class="post-img-wrap" onclick="abrirModalEditarPost('${p.id}')">
          <img src="${esc(p.image)}" alt="${esc(p.title)}" class="post-img" onerror="this.parentElement.style.display='none'">
        </div>` : `<div class="post-accent" style="background:${c.accent}" onclick="abrirModalEditarPost('${p.id}')"></div>`}
      <div class="post-body" onclick="abrirModalEditarPost('${p.id}')">
        <div class="post-title">${esc(p.title)}</div>
        ${p.content ? `<div class="post-content">${esc(p.content)}</div>` : ''}
      </div>
      <div class="post-footer" style="padding:0 12px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px">
        ${p.tag ? `<span class="post-tag" style="background:${c.tag_bg};color:${c.tag_text}">${esc(p.tag)}</span>` : '<span></span>'}
        ${hasSource ? `<a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener" class="post-source-btn" onclick="event.stopPropagation()" title="${esc(p.sourceUrl)}">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M5 2H2a1 1 0 00-1 1v7a1 1 0 001 1h7a1 1 0 001-1V7M8 1h3m0 0v3m0-3L5.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Fuente
        </a>` : ''}
      </div>
    </div>
  `;
}

function renderKanban(posts) {
  return `<div class="kanban-wrap">
    ${KANBAN_COLS.map(col => {
      const cards = posts.filter(p => p.kanbanCol === col.id);
      return `<div class="k-col">
        <div class="k-col-header">
          <span class="k-col-title">${col.label}</span>
          <span class="k-count">${cards.length}</span>
        </div>
        ${cards.map(p => {
          const c = COLORS[p.color] || COLORS.gray;
          const hasImg = p.image && p.image.trim();
          const hasSrc = p.sourceUrl && p.sourceUrl.trim();
          return `<div class="k-card">
            ${hasImg ? `<img src="${esc(p.image)}" style="width:100%;height:60px;object-fit:cover;border-radius:6px;margin-bottom:6px;display:block" onerror="this.style.display='none'" onclick="abrirModalEditarPost('${p.id}')">` : `<div class="k-card-accent" style="background:${c.accent}" onclick="abrirModalEditarPost('${p.id}')"></div>`}
            <div onclick="abrirModalEditarPost('${p.id}')">
              <div class="k-card-title">${esc(p.title)}</div>
              ${p.content ? `<div style="font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4">${esc(p.content)}</div>` : ''}
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
              ${p.tag ? `<span class="k-card-tag" style="background:${c.tag_bg};color:${c.tag_text}">${esc(p.tag)}</span>` : '<span></span>'}
              ${hasSrc ? `<a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener" class="post-source-btn" onclick="event.stopPropagation()">
                <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M5 2H2a1 1 0 00-1 1v7a1 1 0 001 1h7a1 1 0 001-1V7M8 1h3m0 0v3m0-3L5.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Fuente</a>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>`;
    }).join('')}
  </div>`;
}

function renderTimeline() {
  return `<div class="timeline-wrap">
    <div class="tl-months">${TL_MONTHS.map(m=>`<div class="tl-month">${m}</div>`).join('')}</div>
    ${TL_PHASES.map(ph => {
      const c = COLORS[ph.colorKey];
      return `<div class="tl-row">
        <div class="tl-label">${ph.label}</div>
        <div class="tl-bar-area">
          <div class="tl-bar" style="left:${ph.left}%;width:${ph.width}%;background:${c.bg};color:${c.text}">${ph.label}</div>
        </div>
      </div>`;
    }).join('')}
    <div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:var(--radius);font-size:12px;color:var(--muted)">
      La línea de tiempo se construye automáticamente con las fases del proyecto. En v2.0 será editable por post.
    </div>
  </div>`;
}

function emptyState(title, sub) {
  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:8px">
    <div style="font-size:36px;opacity:.3">📋</div>
    <div style="font-size:14px;font-weight:500;color:var(--muted)">${title}</div>
    <div style="font-size:12px;color:var(--muted)">${sub}</div>
  </div>`;
}

   MODAL — NUEVO / EDITAR BOARD
══════════════════════════════════════════════ */
let _modalBoardData = {};

function abrirModalNuevoBoard() {
  _modalBoardData = { color: BOARD_COLORS[0], icon: ICONS[0], privacy: 'team', title: '' };
  renderModalBoard(false);
}

function abrirModalEditarBoard(id) {
  const b = state.boards.find(x => x.id === id);
  if (!b) return;
  _modalBoardData = { ...b };
  renderModalBoard(true);
}

function renderModalBoard(isEdit) {
  const d = _modalBoardData;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="cerrarModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-title">${isEdit ? 'Editar tablero' : 'Nuevo tablero'}</div>
        <div class="form-field">
          <label class="form-label">Nombre</label>
          <input type="text" id="mb-title" placeholder="Ej: Ideas de producto" value="${esc(d.title||'')}">
        </div>
        <div class="form-field">
          <label class="form-label">Ícono</label>
          <div class="icon-picker">
            ${ICONS.map(ic => `<div class="icon-opt${d.icon===ic?' sel':''}" onclick="selIcono('${ic}')">${ic}</div>`).join('')}
          </div>
        </div>
        <div class="form-field">
          <label class="form-label">Color de portada</label>
          <div class="color-picker">
            ${BOARD_COLORS.map(c => `<div class="color-swatch${d.color===c?' sel':''}" style="background:${c}" onclick="selColorBoard('${c}')"></div>`).join('')}
          </div>
        </div>
        <div class="form-field">
          <label class="form-label">Privacidad</label>
          <div class="privacy-select">
            ${[['public','🌐 Público'],['team','👥 Equipo'],['private','🔒 Privado']].map(([val,label]) =>
              `<div class="privacy-opt${d.privacy===val?' sel':''}" onclick="selPrivacidad('${val}')">${label}</div>`
            ).join('')}
          </div>
        </div>
        <div class="modal-actions">
          ${isEdit ? `<button class="btn btn-danger" onclick="eliminarBoard('${d.id}')">Eliminar</button>` : ''}
          <span style="flex:1"></span>
          <button class="btn" onclick="cerrarModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="guardarBoard(${isEdit})">${isEdit ? 'Guardar' : 'Crear'}</button>
        </div>
      </div>
    </div>
  `;
}

function _syncBoardInputs() {
  const t = document.getElementById('mb-title');
  if (t) _modalBoardData.title = t.value;
}
function selIcono(ic) { _syncBoardInputs(); _modalBoardData.icon = ic; renderModalBoard(!!_modalBoardData.id); }
function selColorBoard(c) { _syncBoardInputs(); _modalBoardData.color = c; renderModalBoard(!!_modalBoardData.id); }
function selPrivacidad(v) { _syncBoardInputs(); _modalBoardData.privacy = v; renderModalBoard(!!_modalBoardData.id); }

function guardarBoard(isEdit) {
  const title = document.getElementById('mb-title').value.trim();
  if (!title) { document.getElementById('mb-title').focus(); return; }
  if (isEdit) {
    const idx = state.boards.findIndex(b => b.id === _modalBoardData.id);
    state.boards[idx] = { ...state.boards[idx], ..._modalBoardData, title, updatedAt: new Date().toISOString() };
  } else {
    const id = 'board-' + Date.now();
    state.boards.push({ id, title, icon: _modalBoardData.icon, color: _modalBoardData.color, privacy: _modalBoardData.privacy, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
    state.posts[id] = [];
  }
  guardar();
  cerrarModal();
  if (state.screen === 'home') renderHome();
  else renderBoard();
}

function eliminarBoard(id) {
  if (!confirm('¿Eliminar este tablero y todos sus posts?')) return;
  state.boards = state.boards.filter(b => b.id !== id);
  delete state.posts[id];
  guardar();
  cerrarModal();
  irHome();
}

   MODAL — NUEVO / EDITAR POST
══════════════════════════════════════════════ */
let _modalPostData = {};

function abrirModalNuevoPost() {
  _modalPostData = { color: 'purple', kanbanCol: 'todo', tag: '', title: '', content: '', image: '', sourceUrl: '' };
  renderModalPost(false);
}

function abrirModalEditarPost(id) {
  const posts = state.posts[state.currentBoardId] || [];
  const p = posts.find(x => x.id === id);
  if (!p) return;
  _modalPostData = { ...p };
  renderModalPost(true);
}

function renderModalPost(isEdit) {
  const d = _modalPostData;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="cerrarModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-title">${isEdit ? 'Editar post' : 'Nuevo post'}</div>
        <div class="form-field">
          <label class="form-label">Título</label>
          <input type="text" id="mp-title" placeholder="¿Cuál es la idea?" value="${esc(d.title||'')}">
        </div>
        <div class="form-field">
          <label class="form-label">Descripción breve (opcional)</label>
          <textarea id="mp-content" placeholder="Más detalle sobre la idea..." style="min-height:56px">${esc(d.content||'')}</textarea>
        </div>
        <div class="form-field">
          <label class="form-label">URL de imagen (opcional)</label>
          <input type="text" id="mp-image" placeholder="https://ejemplo.com/imagen.jpg" value="${esc(d.image||'')}">
          ${d.image ? `<img src="${esc(d.image)}" style="margin-top:6px;width:100%;max-height:100px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border)" onerror="this.style.display='none'">` : ''}
        </div>
        <div class="form-field">
          <label class="form-label">Enlace a la fuente (opcional)</label>
          <input type="text" id="mp-source" placeholder="https://fuente.com/articulo" value="${esc(d.sourceUrl||'')}">
        </div>
        <div class="form-field">
          <label class="form-label">Etiqueta</label>
          <input type="text" id="mp-tag" placeholder="Ej: UX, Técnico, IA..." value="${esc(d.tag||'')}">
        </div>
        <div class="form-field">
          <label class="form-label">Color de acento</label>
          <div class="color-picker">
            ${Object.keys(COLORS).map(k => `
              <div class="color-swatch${d.color===k?' sel':''}" style="background:${COLORS[k].accent}" onclick="selColorPost('${k}')"></div>
            `).join('')}
          </div>
        </div>
        <div class="form-field">
          <label class="form-label">Columna Kanban</label>
          <div class="kanban-col-select">
            ${KANBAN_COLS.map(col => `
              <div class="kcol-opt${d.kanbanCol===col.id?' sel':''}" onclick="selKanbanCol('${col.id}')">${col.label}</div>
            `).join('')}
          </div>
        </div>
        <div class="modal-actions">
          ${isEdit ? `<button class="btn btn-danger" onclick="eliminarPost('${d.id}')">Eliminar</button>` : ''}
          <span style="flex:1"></span>
          <button class="btn" onclick="cerrarModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="guardarPost(${isEdit})">${isEdit ? 'Guardar' : 'Agregar'}</button>
        </div>
      </div>
    </div>
  `;
}

function _syncPostInputs() {
  const t   = document.getElementById('mp-title');
  const c   = document.getElementById('mp-content');
  const tag = document.getElementById('mp-tag');
  const img = document.getElementById('mp-image');
  const src = document.getElementById('mp-source');
  if (t)   _modalPostData.title     = t.value;
  if (c)   _modalPostData.content   = c.value;
  if (tag) _modalPostData.tag       = tag.value;
  if (img) _modalPostData.image     = img.value;
  if (src) _modalPostData.sourceUrl = src.value;
}
function selColorPost(k) { _syncPostInputs(); _modalPostData.color = k; renderModalPost(!!_modalPostData.id); }
function selKanbanCol(v) { _syncPostInputs(); _modalPostData.kanbanCol = v; renderModalPost(!!_modalPostData.id); }

function guardarPost(isEdit) {
  const title = document.getElementById('mp-title').value.trim();
  if (!title) { document.getElementById('mp-title').focus(); return; }
  const content = document.getElementById('mp-content').value.trim();
  const tag = document.getElementById('mp-tag').value.trim();
  const bid = state.currentBoardId;
  if (!state.posts[bid]) state.posts[bid] = [];
  if (isEdit) {
    const idx = state.posts[bid].findIndex(p => p.id === _modalPostData.id);
    const image     = document.getElementById('mp-image')?.value.trim()     || _modalPostData.image     || '';
    const sourceUrl = document.getElementById('mp-source')?.value.trim() || _modalPostData.sourceUrl || '';
    state.posts[bid][idx] = { ...state.posts[bid][idx], title, content, tag, image, sourceUrl, color: _modalPostData.color, kanbanCol: _modalPostData.kanbanCol };
  } else {
    const image     = document.getElementById('mp-image')?.value.trim()     || '';
    const sourceUrl = document.getElementById('mp-source')?.value.trim() || '';
    state.posts[bid].push({
      id: 'post-' + Date.now(), boardId: bid, title, content, tag, image, sourceUrl,
      color: _modalPostData.color, kanbanCol: _modalPostData.kanbanCol,
      createdAt: new Date().toISOString()
    });
  }
  // Update board updatedAt
  const bi = state.boards.findIndex(b => b.id === bid);
  if (bi >= 0) state.boards[bi].updatedAt = new Date().toISOString();
  guardar();
  cerrarModal();
  renderLayout();
}

function eliminarPost(id) {
  const bid = state.currentBoardId;
  state.posts[bid] = (state.posts[bid] || []).filter(p => p.id !== id);
  guardar();
  cerrarModal();
  renderLayout();
}

function cerrarModal(event) {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById('modal-root').innerHTML = '';
}

/* ══════════════════════════════════════════════
   AI CHIPS (simulado)
══════════════════════════════════════════════ */
function sugerenciaIA(chip) {
  const posts = state.posts[state.currentBoardId] || [];
  const board = state.boards.find(b => b.id === state.currentBoardId);
  let msg = '';
  if (chip === 'Agrupa ideas similares') {
    const tags = [...new Set(posts.map(p=>p.tag).filter(Boolean))];
    msg = tags.length ? `Posts agrupados por etiqueta: ${tags.join(', ')}. En v2.0 la IA los agrupará por similitud semántica.` : 'No hay posts con etiquetas aún.';
  } else if (chip === 'Sugiere etiquetas') {
    msg = 'En v2.0 Claude analizará el contenido de cada post y sugerirá etiquetas automáticamente.';
  } else if (chip === 'Genera resumen del board') {
    msg = posts.length ? `El tablero "${board?.title}" tiene ${posts.length} posts. Temas detectados: ${[...new Set(posts.map(p=>p.tag).filter(Boolean))].join(', ') || 'sin etiquetas'}.` : 'El board está vacío, agrega posts primero.';
  } else if (chip === 'Detecta temas repetidos') {
    const tags = posts.map(p=>p.tag).filter(Boolean);
    const dupes = tags.filter((t,i)=>tags.indexOf(t)!==i);
    msg = dupes.length ? `Temas repetidos: ${[...new Set(dupes)].join(', ')}` : 'No se detectaron temas repetidos.';
  } else {
    msg = 'En v2.0 Claude sugerirá acciones concretas basadas en el contenido del board.';
  }
  mostrarToast('✦ IA: ' + msg);
}

function mostrarToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1C1B1A;color:#fff;padding:10px 18px;border-radius:var(--radius);font-size:13px;z-index:300;max-width:480px;text-align:center;animation:fadeIn .2s ease';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

/* ══════════════════════════════════════════════
   ONBOARDING
══════════════════════════════════════════════ */
const OB_ROLES = [
  { id:'edu',      icon:'🎓', label:'Educador',  sub:'Aulas y proyectos' },
  { id:'team',     icon:'💼', label:'Equipo',    sub:'Trabajo colaborativo' },
  { id:'creative', icon:'🎨', label:'Creativo',  sub:'Ideas y proyectos' },
  { id:'personal', icon:'👤', label:'Personal',  sub:'Uso propio' },
];
const OB_TMPLS = [
  { id:'brain',  icon:'💡', color:'#EDE9FE', label:'Lluvia de ideas', sub:'Muro libre' },
  { id:'road',   icon:'🗺', color:'#D1FAE5', label:'Roadmap',         sub:'Línea de tiempo' },
  { id:'kanban', icon:'📋', color:'#FEF3C7', label:'Kanban',          sub:'Flujo de tareas' },
  { id:'blank',  icon:'✦', color:'#F3F4F6', label:'En blanco',       sub:'Empezar libre' },
];
const OB_PRIVS = [
  { id:'public',  icon:'🌐', name:'Público',     desc:'Cualquiera con el link' },
  { id:'team',    icon:'👥', name:'Solo equipo',  desc:'Solo colaboradores' },
  { id:'private', icon:'🔒', name:'Privado',      desc:'Solo tú' },
];
let _ob = { step:0, role:'', name:'', avatarColor:'#4440B8', template:'', privacy:'team' };

function renderOnboarding() {
  const el = document.getElementById('screen-onboarding');
  const pct = ['20','40','60','80','100'][_ob.step] || '100';
  let body = '';

  if (_ob.step === 0) {
    body = `
      <div class="ob-step-label">Paso 1 de 5</div>
      <div class="ob-title">¿Cómo usarás el tablero?</div>
      <div class="ob-sub">Elige el que mejor describe tu caso.</div>
      <div class="ob-role-grid">
        ${OB_ROLES.map(r=>`
          <div class="ob-role${_ob.role===r.id?' sel':''}" onclick="obSelRole('${r.id}')">
            <div class="ob-role-icon">${r.icon}</div>
            <div class="ob-role-name">${r.label}</div>
            <div class="ob-role-sub">${r.sub}</div>
          </div>`).join('')}
      </div>
      <div class="ob-actions">
        <span></span>
        <button class="btn btn-primary" onclick="obNext()" ${!_ob.role?'disabled style="opacity:.4"':''}>Continuar</button>
      </div>
    `;
  } else if (_ob.step === 1) {
    const init = _ob.name.trim().split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';
    const avColors = ['#4440B8','#0D9488','#D97706','#DC2626','#7C3AED','#059669'];
    body = `
      <div class="ob-step-label">Paso 2 de 5</div>
      <div class="ob-title">Tu perfil</div>
      <div class="ob-sub">¿Cómo te llamamos en los tableros?</div>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
        <div style="width:48px;height:48px;border-radius:50%;background:${_ob.avatarColor};color:#fff;font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0">${init}</div>
        <input type="text" id="ob-name" placeholder="Tu nombre" value="${esc(_ob.name)}" oninput="_ob.name=this.value;renderOnboarding()" style="flex:1">
      </div>
      <div class="form-label" style="margin-bottom:8px">Color de avatar</div>
      <div class="color-picker" style="margin-bottom:4px">
        ${avColors.map(c=>`<div class="color-swatch${_ob.avatarColor===c?' sel':''}" style="background:${c}" onclick="obSelAvatar('${c}')"></div>`).join('')}
      </div>
      <div class="ob-actions">
        <button class="btn-ghost" onclick="obBack()">← Atrás</button>
        <button class="btn btn-primary" onclick="obNext()" ${!_ob.name.trim()?'disabled style="opacity:.4"':''}>Continuar</button>
      </div>
    `;
  } else if (_ob.step === 2) {
    body = `
      <div class="ob-step-label">Paso 3 de 5</div>
      <div class="ob-title">Elige una plantilla</div>
      <div class="ob-sub">Para tu primer tablero. Puedes cambiarla después.</div>
      <div class="ob-tmpl-grid">
        ${OB_TMPLS.map(t=>`
          <div class="ob-tmpl${_ob.template===t.id?' sel':''}" onclick="obSelTmpl('${t.id}')">
            <div class="ob-tmpl-cover" style="background:${t.color}">${t.icon}</div>
            <div class="ob-tmpl-body">
              <div class="ob-tmpl-title">${t.label}</div>
              <div class="ob-tmpl-sub">${t.sub}</div>
            </div>
          </div>`).join('')}
      </div>
      <div class="ob-actions">
        <button class="btn-ghost" onclick="obBack()">← Atrás</button>
        <button class="btn btn-primary" onclick="obNext()" ${!_ob.template?'disabled style="opacity:.4"':''}>Continuar</button>
      </div>
    `;
  } else if (_ob.step === 3) {
    body = `
      <div class="ob-step-label">Paso 4 de 5</div>
      <div class="ob-title">Privacidad del tablero</div>
      <div class="ob-sub">¿Quién puede ver este tablero?</div>
      <div class="ob-priv-list">
        ${OB_PRIVS.map(p=>`
          <div class="ob-priv${_ob.privacy===p.id?' sel':''}" onclick="obSelPriv('${p.id}')">
            <div class="ob-radio${_ob.privacy===p.id?' on':''}"></div>
            <span style="font-size:16px">${p.icon}</span>
            <div>
              <div style="font-size:13px;font-weight:500;color:var(--text)">${p.name}</div>
              <div style="font-size:11px;color:var(--muted)">${p.desc}</div>
            </div>
          </div>`).join('')}
      </div>
      <div class="ob-actions">
        <button class="btn-ghost" onclick="obBack()">← Atrás</button>
        <button class="btn btn-primary" onclick="obNext()">Continuar</button>
      </div>
    `;
  } else if (_ob.step === 4) {
    body = `
      <div class="ob-step-label">Paso 5 de 5</div>
      <div class="ob-title">Invita a tu equipo</div>
      <div class="ob-sub">Puedes invitar más personas en cualquier momento.</div>
      <input type="email" placeholder="correo@ejemplo.com" style="margin-bottom:8px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Recibirán un link de invitación. (Simulado en MVP)</div>
      <div class="ob-actions">
        <button class="btn-ghost" onclick="obBack()">← Atrás</button>
        <div style="display:flex;gap:8px">
          <button class="btn" onclick="obFinalizar()">Omitir</button>
          <button class="btn btn-primary" onclick="obFinalizar()">Crear tablero</button>
        </div>
      </div>
    `;
  } else {
    body = `
      <div class="ob-success">
        <div class="ob-success-icon">🎉</div>
        <div class="ob-title">¡Todo listo, ${esc(_ob.name.trim().split(' ')[0])}!</div>
        <div class="ob-sub" style="margin-bottom:20px">Tu tablero está listo.</div>
        <button class="btn btn-primary" style="width:100%" onclick="obEntrar()">Entrar al tablero →</button>
      </div>
    `;
  }

  el.innerHTML = `
    <div class="ob-card">
      <div class="ob-progress"><div class="ob-fill" style="width:${pct}%"></div></div>
      <div class="ob-body">${body}</div>
    </div>
  `;
}

function obSelRole(r) { _ob.role = r; renderOnboarding(); }
function obSelAvatar(c) { _ob.avatarColor = c; renderOnboarding(); }
function obSelTmpl(t) { _ob.template = t; renderOnboarding(); }
function obSelPriv(p) { _ob.privacy = p; renderOnboarding(); }
function obNext() { if (_ob.step < 5) { _ob.step++; renderOnboarding(); } }
function obBack() { if (_ob.step > 0) { _ob.step--; renderOnboarding(); } }

function obFinalizar() {
  // Guardar usuario
  state.user = { name: _ob.name || 'Usuario', avatarColor: _ob.avatarColor, role: _ob.role || 'personal' };
  // Crear board inicial
  const tmpl = OB_TMPLS.find(t => t.id === _ob.template) || OB_TMPLS[0];
  const id = 'board-' + Date.now();
  state.boards.push({ id, title: tmpl.label, icon: tmpl.icon, color: tmpl.color, privacy: _ob.privacy, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
  state.posts[id] = [];
  guardar();
  localStorage.setItem('tablero_onboarded', '1');
  _ob.step = 5;
  renderOnboarding();
}

function obEntrar() {
  irHome();
}

}

/* ══════════════════════════════════════════════
   UTILIDADES
══════════════════════════════════════════════ */
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ══════════════════════════════════════════════
   ARRANQUE
══════════════════════════════════════════════ */
cargar();
const yaOnboarded = localStorage.getItem('tablero_onboarded');

if (!yaOnboarded) {
  // Primera visita
  mostrar('onboarding');
  renderOnboarding();
} else {
  // Sembrar datos de ejemplo si no hay boards
  if (state.boards.length === 0) sembrarDatos();
  renderHome();
  mostrar('home');
}
</script>
