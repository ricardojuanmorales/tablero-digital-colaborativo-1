<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero — MVP v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F0;--surface:#fff;--accent:#4440B8;--accent2:#6C68D4;
  --text:#1C1B1A;--muted:#7A7875;--border:#E4E1D9;
  --r:10px;--rl:16px;
  --ffd:'Fraunces',Georgia,serif;--ffb:'DM Sans',system-ui,sans-serif;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
html{font-family:var(--ffb);font-size:15px;color:var(--text);background:var(--bg)}
button{font-family:var(--ffb);cursor:pointer}
input,textarea{font-family:var(--ffb)}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

/* template selector */
.tmpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.tmpl-opt{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .12s}
.tmpl-opt:hover{border-color:var(--accent2);transform:translateY(-1px)}
.tmpl-opt.sel{border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(68,64,184,.1)}
.tmpl-cov{height:52px;display:flex;align-items:center;justify-content:center;font-size:22px}
.tmpl-bod{padding:7px 10px 9px}
.tmpl-name{font-size:12px;font-weight:500;color:var(--text)}
.tmpl-desc{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3}

/* inputs */
input[type=text],input[type=email],textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
input[type=text]:focus,input[type=email]:focus,textarea:focus{border-color:var(--accent2)}
textarea{resize:vertical;min-height:64px}

/* buttons */
.btn{padding:8px 18px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;font-weight:500;transition:all .15s}
.btn:hover{background:var(--bg);color:var(--text)}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-p:hover{background:#3735a0}
.btn-g{border:none;background:transparent;color:var(--muted);padding:6px 10px;font-size:13px}
.btn-g:hover{color:var(--text);background:var(--bg);border-radius:var(--r)}
.btn-d{color:#c0392b;border-color:#f5c6c6;background:#fff5f5}
.btn-d:hover{background:#fee2e2}

/* app shell */
#app{min-height:100vh;display:flex;flex-direction:column}
#topbar{height:52px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100;flex-shrink:0}
.logo{font-family:var(--ffd);font-size:20px;font-weight:600;color:var(--accent);letter-spacing:-.5px}
.logo span{font-style:italic}
.tsp{flex:1}
.av-chip{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#fff;flex-shrink:0}

/* home */
#screen-home{flex:1;padding:36px 32px;max-width:1080px;margin:0 auto;width:100%}
.home-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap}
.home-hgroup{}
.home-h{font-family:var(--ffd);font-size:32px;font-weight:600;margin-bottom:4px;color:var(--text);letter-spacing:-.5px}
.home-s{font-size:14px;color:var(--muted);line-height:1.5}
.home-count{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 12px;white-space:nowrap;align-self:center}
/* grilla de tableros */
.bg{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:700px){.bg{grid-template-columns:repeat(2,1fr)}}
@media(max-width:440px){.bg{grid-template-columns:1fr}}
/* tarjeta de tablero */
.bc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .15s;display:flex;flex-direction:column}
.bc:hover{box-shadow:0 8px 24px rgba(0,0,0,.10);transform:translateY(-3px)}
.bc-cov{height:96px;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative;flex-shrink:0}
.bc-cov-icon{position:relative;z-index:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}
.bc-cov-dots{position:absolute;inset:0;opacity:.18;background-image:radial-gradient(circle,#000 1px,transparent 1px);background-size:16px 16px}
.bc-bod{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:5px}
.bc-ttl{font-size:16px;font-weight:600;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bc-desc{font-size:12px;color:var(--muted);line-height:1.5;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bc-ft{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.bc-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.bc-priv{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
/* tarjeta nuevo tablero */
.bc-new{border:2px dashed var(--border);border-radius:var(--rl);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:190px;cursor:pointer;color:var(--muted);font-size:13px;transition:all .15s;background:transparent}
.bc-new:hover{border-color:var(--accent2);color:var(--accent);background:#f5f4ff}
.pr{width:40px;height:40px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:22px;transition:all .15s}
.bc-new:hover .pr{background:var(--accent);border-color:var(--accent);color:#fff}

/* menú contextual ⋯ */
.bc{position:relative}
.bc-menu-btn{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:var(--r);border:none;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s;z-index:2;line-height:1}
.bc:hover .bc-menu-btn{opacity:1}
.bc-menu-btn:hover{background:#fff;color:var(--text)}
.ctx-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:500;min-width:160px;padding:4px;animation:fi .1s ease}
.ctx-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;font-size:13px;color:var(--text);cursor:pointer;transition:background .1s}
.ctx-item:hover{background:var(--bg)}
.ctx-item.danger{color:#DC2626}
.ctx-item.danger:hover{background:#FEE2E2}
.ctx-divider{height:1px;background:var(--border);margin:4px 0}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:600;animation:fi .15s ease}
.confirm-box{background:var(--surface);border-radius:var(--rl);padding:24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:su .18s ease}
.confirm-icon{font-size:32px;margin-bottom:12px}
.confirm-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
.confirm-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:20px}
.confirm-actions{display:flex;gap:8px;justify-content:flex-end}

/* botón volver home */
.btn-back{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;white-space:nowrap}
.btn-back:hover{background:var(--bg);color:var(--accent);border-color:var(--accent2)}
.bh-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}

/* board screen */
#screen-board{flex:1;display:flex;overflow:hidden}
#sidebar{width:200px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow-y:auto;padding:12px 0}
.sb-lbl{font-size:10px;font-weight:500;color:var(--muted);padding:8px 16px 4px;letter-spacing:.05em;text-transform:uppercase}
.sb-it{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:13px;color:var(--muted);cursor:pointer;transition:all .1s;white-space:nowrap;overflow:hidden}
.sb-it:hover,.sb-it.active{color:var(--text);background:var(--bg)}
.sb-it.active{font-weight:500}
#board-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
#board-head{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.bh-ttl{font-size:15px;font-weight:500}
.priv-b{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.lay-btns{display:flex;gap:3px;margin-left:auto}
.lay-btn{width:30px;height:30px;border-radius:var(--r);border:1px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:all .12s}
.lay-btn.active{background:#EEEDFB;border-color:var(--accent2);color:var(--accent)}
#board-area{flex:1;overflow:auto;padding:20px}

/* post cards */
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;transition:box-shadow .15s}
.pc:hover{box-shadow:var(--sh)}
.pc-acc{height:4px}
.pc-imgw{overflow:hidden;cursor:pointer}
.pc-img{width:100%;height:130px;object-fit:cover;display:block;transition:transform .2s}
.pc:hover .pc-img{transform:scale(1.03)}
.pc-bod{padding:12px 13px 8px;cursor:pointer}
.pc-ttl{font-size:15px;font-weight:600;margin-bottom:5px;line-height:1.3;color:var(--text)}
.pc-txt{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:6px}
.pc-ft{padding:0 12px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.pc-tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
.pc-src{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted);background:var(--bg);text-decoration:none;transition:all .12s;white-space:nowrap}
.pc-src:hover{border-color:var(--accent2);color:var(--accent);background:#f5f4ff}

/* kanban */
.kw{display:flex;gap:12px;align-items:flex-start;min-height:300px}
.kc{flex:1;min-width:150px;background:var(--bg);border-radius:var(--rl);padding:10px}
.kc-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.kc-t{font-size:11px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:.05em}
.kc-n{font-size:10px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 7px;color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;margin-bottom:6px;cursor:pointer;transition:box-shadow .12s;overflow:hidden}
.kcard:hover{box-shadow:var(--sh)}
.kc-acc{width:100%;height:3px;border-radius:2px;margin-bottom:8px}
.kc-ttl{font-size:12px;font-weight:500;margin-bottom:3px}

/* timeline */
.tlw{display:flex;flex-direction:column;min-width:600px}
.tl-mos{display:flex;margin-left:130px;margin-bottom:6px}
.tl-mo{flex:1;font-size:10px;color:var(--muted);text-align:center;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.tl-row{display:flex;align-items:center;min-height:40px;border-bottom:1px solid var(--border)}
.tl-lbl{width:130px;flex-shrink:0;font-size:12px;color:var(--muted);padding-right:12px;text-align:right}
.tl-ba{flex:1;position:relative;height:24px}
.tl-bar{height:100%;border-radius:6px;position:absolute;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden}
/* timeline dinámico */
.tl-posts-row{flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;min-height:40px}
.tl-post-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;transition:opacity .12s;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-post-pill:hover{opacity:.8}
.tl-empty-row{font-size:11px;color:var(--border);font-style:italic;padding:6px 0}
.tl-col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ai panel */
#ai-panel{border-top:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;background:var(--surface);flex-shrink:0}
.ai-gem{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-chips{display:flex;gap:6px;overflow-x:auto;flex:1}
.ai-chips::-webkit-scrollbar{display:none}
.ai-chip{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .12s}
.ai-chip:hover{border-color:var(--accent2);color:var(--accent);background:#f5f4ff}

/* modales */
.mbk{position:fixed;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:200;animation:fi .15s ease}
@keyframes fi{from{opacity:0}}
.mdl{background:var(--surface);border-radius:var(--rl);padding:24px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:su .18s ease;max-height:90vh;overflow-y:auto}
@keyframes su{from{opacity:0;transform:translateY(12px)}}
.mdl-ttl{font-family:var(--ffd);font-size:18px;font-weight:400;margin-bottom:18px}
.ff{margin-bottom:14px}
.fl{font-size:12px;color:var(--muted);margin-bottom:5px;display:block;font-weight:500}
.mac{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;align-items:center}
.cp{display:flex;gap:8px;flex-wrap:wrap}
.cs{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .12s}
.cs.sel{border-color:var(--text);transform:scale(1.15)}
.ip{display:flex;gap:6px;flex-wrap:wrap}
.io{width:34px;height:34px;border-radius:var(--r);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .12s}
.io.sel{border-color:var(--accent2);background:#f5f4ff}
.pvs{display:flex;gap:6px}
.pvo{flex:1;border:1px solid var(--border);border-radius:var(--r);padding:7px;cursor:pointer;text-align:center;font-size:11px;color:var(--muted);transition:all .12s}
.pvo.sel{border-color:var(--accent2);background:#f5f4ff;color:var(--accent);font-weight:500}
.kcs{display:flex;gap:5px;flex-wrap:wrap}
.kco{flex:1;min-width:80px;border:1px solid var(--border);border-radius:var(--r);padding:6px 8px;text-align:center;font-size:11px;color:var(--muted);cursor:pointer;transition:all .12s}
.kco.sel{border-color:var(--accent2);background:#f5f4ff;color:var(--accent);font-weight:500}
.imgp{width:100%;height:90px;object-fit:cover;border-radius:var(--r);border:1px solid var(--border);margin-top:6px;display:block}

/* export/import */
.ei-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px}
.ei-tab{padding:8px 16px;font-size:13px;color:var(--muted);cursor:pointer;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;font-family:var(--ffb);transition:all .12s}
.ei-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.ei-sec{display:none}.ei-sec.active{display:block}
.exp-pre{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px;font-size:11px;color:var(--muted);font-family:monospace;max-height:130px;overflow:auto;white-space:pre;line-height:1.5;margin-bottom:12px}
.dz{border:2px dashed var(--border);border-radius:var(--rl);padding:24px 20px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:12px}
.dz:hover,.dz.drag-over{border-color:var(--accent2);background:#f5f4ff}
.dz-ico{font-size:26px;margin-bottom:6px}
.dz-lbl{font-size:13px;color:var(--muted)}
.dz-sub{font-size:11px;color:var(--muted);margin-top:3px}
.im-mode{display:flex;gap:6px;margin-bottom:12px}
.imo{flex:1;border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;text-align:center;cursor:pointer;font-size:12px;color:var(--muted);transition:all .12s}
.imo:hover{border-color:var(--accent2)}
.imo.sel{border-color:var(--accent);background:#EEEDFB;color:var(--accent);font-weight:500}
.imo-t{font-weight:500;margin-bottom:2px}
.imo-s{font-size:10px;opacity:.8}
.ist{padding:10px 12px;border-radius:var(--r);font-size:12px;margin-bottom:12px}
.ist.ok{background:#D1FAE5;color:#065F46}
.ist.err{background:#FEE2E2;color:#991B1B}

/* onboarding */
#screen-onboarding{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}
.ob-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);width:100%;max-width:420px;overflow:hidden}
.ob-prog{height:3px;background:var(--bg)}
.ob-fill{height:3px;background:var(--accent);transition:width .3s ease}
.ob-body{padding:32px 28px 24px}
.ob-sl{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.ob-ttl{font-family:var(--ffd);font-size:22px;font-weight:400;margin-bottom:6px;line-height:1.3}
.ob-sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.6}
.ob-act{display:flex;align-items:center;justify-content:space-between;margin-top:24px}
.ob-rg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ob-role{border:1px solid var(--border);border-radius:var(--r);padding:12px 10px;cursor:pointer;text-align:center;transition:all .12s}
.ob-role:hover{border-color:var(--accent2);background:#f5f4ff}
.ob-role.sel{border-color:var(--accent);background:#EEEDFB}
.ob-ri{font-size:22px;margin-bottom:5px}
.ob-rn{font-size:12px;font-weight:500}
.ob-rs{font-size:11px;color:var(--muted);margin-top:1px}
.ob-tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ob-tmpl{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .12s}
.ob-tmpl:hover{border-color:var(--accent2)}
.ob-tmpl.sel{border-color:var(--accent)}
.ob-tc{height:44px;display:flex;align-items:center;justify-content:center;font-size:18px}
.ob-tb{padding:7px 10px}
.ob-tt{font-size:12px;font-weight:500}
.ob-ts{font-size:11px;color:var(--muted)}
.ob-pl{display:flex;flex-direction:column;gap:8px}
.ob-priv{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .12s}
.ob-priv:hover{border-color:var(--accent2)}
.ob-priv.sel{border-color:var(--accent);background:#f5f4ff}
.ob-rad{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ob-rad.on{border-color:var(--accent);background:var(--accent)}
.ob-rad.on::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff}
.ob-ok{text-align:center;padding:16px 0}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1C1B1A;color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:300;max-width:480px;text-align:center;animation:fi .2s ease;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo">ta<span>bl</span>ero</div>
    <div class="tsp"></div>
    <div id="tb-act"></div>
  </div>
  <div id="screen-onboarding" class="hidden"></div>
  <div id="screen-home" class="hidden"></div>
  <div id="screen-board" class="hidden">
    <div id="sidebar"></div>
    <div id="board-content">
      <div id="board-head"></div>
      <div id="board-area"></div>
      <div id="ai-panel"></div>
    </div>
  </div>
</div>
<div id="modal-root"></div>

/* ── TIMELINE ── */
function renderTL(){
  const posts  = S.posts[S.boardId] || [];
  const cols   = getKcols(S.boardId);
  const CKEYS  = Object.keys(COLORS);
  const totalP = posts.length;

  if(!totalP){
    return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:8px">
      <div style="font-size:36px;opacity:.3">🗓</div>
      <div style="font-size:14px;font-weight:500;color:var(--muted)">Aún no hay posts</div>
      <div style="font-size:12px;color:var(--muted)">Agrega posts y aparecerán aquí ordenados por columna</div>
    </div>`;
  }

  // Encabezado: columnas como etiquetas de fase
  const header = `<div style="display:flex;margin-left:140px;margin-bottom:8px;gap:0">
    ${cols.map(col=>`<div style="flex:1;font-size:10px;color:var(--muted);text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.05em">${col.l}</div>`).join('')}
  </div>`;

  // Filas: una por post, barra que avanza según columna
  const rows = posts.map((p,i)=>{
    const c     = COLORS[p.color] || COLORS.violet;
    const colIdx= cols.findIndex(col=>col.id===p.kc);
    const pos   = colIdx < 0 ? 0 : colIdx;
    const pct   = cols.length > 1 ? (pos/(cols.length-1))*100 : 0;
    const barW  = Math.max(20, Math.round(100/cols.length));
    const left  = Math.min(pct, 100-barW);
    return`<div class="tl-row" style="cursor:pointer" onclick="openEditPost('${p.id}')">
      <div class="tl-lbl" style="font-size:12px;color:var(--text);font-weight:500;padding-right:12px;width:140px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(p.title)}">${esc(p.title)}</div>
      <div class="tl-ba">
        <div class="tl-bar" style="left:${left}%;width:${barW}%;background:${c.bg};color:${c.text};border:1px solid ${c.accent}20">
          ${esc(p.tag||cols[pos]?.l||'')}
        </div>
      </div>
    </div>`;
  }).join('');

  // Leyenda de columnas al pie
  const legend = `<div style="display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap">
    <span style="font-size:11px;color:var(--muted);font-weight:500">Columnas:</span>
    ${cols.map((col,i)=>{
      const ck=CKEYS[i%CKEYS.length];
      const c=COLORS[ck];
      return`<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)">
        <span style="width:8px;height:8px;border-radius:50%;background:${c.accent};display:inline-block"></span>
        ${col.l}
      </span>`;
    }).join('')}
  </div>`;

  return`<div class="tlw">${header}${rows}${legend}</div>`;
}

function openCtxMenu(e,id){
  e.stopPropagation();
  cerrarCtxMenu();
  const rect=e.currentTarget.getBoundingClientRect();
  const menu=document.createElement('div');
  menu.className='ctx-menu';
  menu.id='ctx-menu';
  // FIX: no llamar cerrarCtxMenu dentro del onclick — se usa setTimeout
  // para separar el cierre del menú de la ejecución de la acción
  menu.innerHTML=`
    <div class="ctx-item" data-action="open" data-id="${id}">
      <span>📂</span> Abrir tablero
    </div>
    <div class="ctx-item" data-action="edit" data-id="${id}">
      <span>✏️</span> Editar
    </div>
    <div class="ctx-divider"></div>
    <div class="ctx-item danger" data-action="delete" data-id="${id}">
      <span>🗑</span> Eliminar tablero
    </div>`;
  menu.addEventListener('click', function(ev){
    ev.stopPropagation();
    const item=ev.target.closest('[data-action]');
    if(!item)return;
    const action=item.dataset.action;
    const bid=item.dataset.id;
    cerrarCtxMenu();
    // FIX: setTimeout separa el cierre del menú de la acción siguiente
    setTimeout(()=>{
      if(action==='open')   goBoard(bid);
      else if(action==='edit')   openEditBoard(bid);
      else if(action==='delete') confirmDeleteBoard(bid);
    },0);
  });
  document.body.appendChild(menu);
  const mw=menu.offsetWidth, mh=menu.offsetHeight;
  let top=rect.bottom+6, left=rect.left;
  if(left+mw>window.innerWidth-8) left=window.innerWidth-mw-8;
  if(top+mh>window.innerHeight-8) top=rect.top-mh-6;
  menu.style.top=top+'px';
  menu.style.left=left+'px';
  setTimeout(()=>document.addEventListener('click',cerrarCtxMenu,{once:true}),10);
}
function cerrarCtxMenu(){
  const m=document.getElementById('ctx-menu');
  if(m)m.remove();
}

        </div>
      </div>
    </div>`;

  const fi=document.getElementById('imp-file');
  if(fi){
    fi.value='';
    // Clonar el elemento para eliminar listeners previos y evitar duplicados
    const fiNew=fi.cloneNode(true);
    fi.parentNode.replaceChild(fiNew,fi);

function doExport(){
  const exp={version:'1.0',exportedAt:n(),user:S.user,boards:S.boards,posts:S.posts};
  const json=JSON.stringify(exp,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='tablero-backup-'+n().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  closeModal();
  toast('✓ Backup descargado — '+S.boards.length+' tablero(s), '+Object.values(S.posts).reduce((a,b)=>a+b.length,0)+' post(s)');
}
function readFile(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    let ok=false;
    try{
      const d=JSON.parse(ev.target.result);
      // Acepta tanto el formato nuevo (boards/posts) como el antiguo
      if(Array.isArray(d.boards)&&typeof d.posts==='object'){
        d._fn=file.name;
        _impData=d;
        ok=true;
      }
    }catch(err){
      console.error('Error al leer backup:',err);
    }
    if(!ok){
      _impData=null;
      toast('⚠ Archivo inválido. Debe ser un backup .json exportado por Tablero');
    }
    renderEI('import');
  };
  r.onerror=()=>toast('⚠ No se pudo leer el archivo');
  r.readAsText(file);
}
function handleDrop(e){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  readFile(e.dataTransfer.files[0]);
}
function doImport(){
  if(!_impData)return;
  if(_impMode==='replace'){
    if(!confirm('⚠️ Esto reemplazará todos tus tableros y posts actuales. ¿Continuar?'))return;
    S.boards=_impData.boards||[];S.posts=_impData.posts||{};
    if(_impData.user)S.user=_impData.user;
  }else{
    const ids=new Set(S.boards.map(b=>b.id));
    const nuevos=(_impData.boards||[]).filter(b=>!ids.has(b.id));
    S.boards=[...S.boards,...nuevos];
    nuevos.forEach(b=>{S.posts[b.id]=(_impData.posts||{})[b.id]||[];});
  }
  localStorage.setItem('tb_onboarded','1');
  guardar();closeModal();renderHome();show('home');
  toast(`✓ Tableros ${_impMode==='replace'?'reemplazados':'combinados'} correctamente`);
}

function aiChip(chip){
  const posts=S.posts[S.boardId]||[];
  const board=S.boards.find(b=>b.id===S.boardId);
  let msg='';
  if(chip==='Agrupa ideas similares'){const tags=[...new Set(posts.map(p=>p.tag).filter(Boolean))];msg=tags.length?`Posts agrupados por etiqueta: ${tags.join(', ')}.`:'No hay posts con etiquetas aún.';}
  else if(chip==='Sugiere etiquetas')msg='En v2.0 Claude analizará cada post y sugerirá etiquetas automáticamente.';
  else if(chip==='Genera resumen del board'){const tags=[...new Set(posts.map(p=>p.tag).filter(Boolean))];msg=posts.length?`"${board?.title}": ${posts.length} posts. Temas: ${tags.join(', ')||'sin etiquetas'}.`:'El board está vacío.';}
  else if(chip==='Detecta temas repetidos'){const tags=posts.map(p=>p.tag).filter(Boolean);const dup=[...new Set(tags.filter((t,i)=>tags.indexOf(t)!==i))];msg=dup.length?`Temas repetidos: ${dup.join(', ')}`:'No se detectaron temas repetidos.';}
  else msg='En v2.0 Claude sugerirá acciones concretas basadas en el contenido del board.';
  toast('✦ IA: '+msg);
}

  }else if(_ob.step===2){
    body=`<div class="ob-sl">Paso 3 de 5</div><div class="ob-ttl">Elige una plantilla</div><div class="ob-sub">Para tu primer tablero.</div>
      <div class="ob-tg">${OB_TMPLS.map(t=>`<div class="ob-tmpl${_ob.tmpl===t.id?' sel':''}" onclick="_ob.tmpl='${t.id}';renderOB()"><div class="ob-tc" style="background:${t.color}">${t.icon}</div><div class="ob-tb"><div class="ob-tt">${t.name}</div><div class="ob-ts">${t.sub}</div></div></div>`).join('')}</div>
      <div class="ob-act"><button class="btn-g" onclick="obB()">← Atrás</button><button class="btn btn-p" onclick="obN()" ${!_ob.tmpl?'disabled style="opacity:.4"':''}>Continuar</button></div>`;
  }else if(_ob.step===3){
    body=`<div class="ob-sl">Paso 4 de 5</div><div class="ob-ttl">Privacidad</div><div class="ob-sub">¿Quién puede ver este tablero?</div>
      <div class="ob-pl">${OB_PRIVS.map(p=>`<div class="ob-priv${_ob.priv===p.id?' sel':''}" onclick="_ob.priv='${p.id}';renderOB()"><div class="ob-rad${_ob.priv===p.id?' on':''}"></div><span style="font-size:16px">${p.icon}</span><div><div style="font-size:13px;font-weight:500">${p.name}</div><div style="font-size:11px;color:var(--muted)">${p.desc}</div></div></div>`).join('')}</div>
      <div class="ob-act"><button class="btn-g" onclick="obB()">← Atrás</button><button class="btn btn-p" onclick="obN()">Continuar</button></div>`;
  }else if(_ob.step===4){
    body=`<div class="ob-sl">Paso 5 de 5</div><div class="ob-ttl">Invita a tu equipo</div><div class="ob-sub">Puedes invitar más personas después.</div>
      <input type="email" placeholder="correo@ejemplo.com" style="margin-bottom:8px">
      <div style="font-size:11px;color:var(--muted)">Simulado en MVP</div>
      <div class="ob-act"><button class="btn-g" onclick="obB()">← Atrás</button><div style="display:flex;gap:8px"><button class="btn" onclick="obFin()">Omitir</button><button class="btn btn-p" onclick="obFin()">Crear tablero</button></div></div>`;
  }else{
    const nm=_ob.name.trim().split(' ')[0]||'allá';
    body=`<div class="ob-ok"><div style="font-size:44px;margin-bottom:14px">🎉</div><div class="ob-ttl" style="margin-bottom:6px">¡Todo listo, ${esc(nm)}!</div><div class="ob-sub" style="margin-bottom:20px">Tu tablero está creado.</div><button class="btn btn-p" style="width:100%" onclick="goHome()">Entrar al tablero →</button></div>`;
  }
  document.getElementById('screen-onboarding').innerHTML=`
    <div class="ob-card">
      <div class="ob-prog"><div class="ob-fill" style="width:${pct}%"></div></div>
      <div class="ob-body">${body}</div>
    </div>`;
}
function obN(){if(_ob.step<5){_ob.step++;renderOB();}}
function obB(){if(_ob.step>0){_ob.step--;renderOB();}}
function obFin(){
  S.user={name:_ob.name||'Usuario',avatarColor:_ob.ac,role:_ob.role||'personal'};
  const tmpl=OB_TMPLS.find(t=>t.id===_ob.tmpl)||OB_TMPLS[0];
  const id='b'+Date.now();
  S.boards.push({id,title:tmpl.name,icon:tmpl.icon,color:tmpl.color,privacy:_ob.priv,ca:n(),ua:n()});
  S.posts[id]=[];
  guardar();localStorage.setItem('tb_onboarded','1');
  _ob.step=5;renderOB();
}

/* ── TOAST ── */
function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),3200);
}

/* ── UTILS ── */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function initials(name){return(name||'').trim().split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';}
function svgMuro(){return`<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" fill="currentColor"/><rect x="8" y="1" width="5" height="5" rx="1" fill="currentColor"/><rect x="1" y="8" width="5" height="5" rx="1" fill="currentColor"/><rect x="8" y="8" width="5" height="5" rx="1" fill="currentColor"/></svg>`;}
function svgKan(){return`<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="3" height="12" rx="1" fill="currentColor"/><rect x="5.5" y="1" width="3" height="8" rx="1" fill="currentColor"/><rect x="10" y="1" width="3" height="10" rx="1" fill="currentColor"/></svg>`;}
function svgTl(){return`<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="1" y1="3" x2="13" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="1" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="1" y1="11" x2="13" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;}
function svgLnk(){return`<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M5 2H2a1 1 0 00-1 1v7a1 1 0 001 1h7a1 1 0 001-1V7M8 1h3m0 0v3m0-3L5.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function svgExp(){return`<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M4 6l3 3 3-3M2 10v2a1 1 0 001 1h8a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function svgImp(){return`<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 9V1M4 4l3-3 3 3M2 10v2a1 1 0 001 1h8a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}

/* ── ARRANQUE ── */
cargar();
if(!localStorage.getItem('tb_onboarded')){show('onboarding');renderOB();}
else{if(!S.boards.length)sembrar();show('home');renderHome();}
</script>
</body>
</html>
